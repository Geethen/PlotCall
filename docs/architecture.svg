<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700"
     font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">PlotCall architecture</title>
<desc id="d">Points are cut into batches and their evidence baked offline; the app is a static folder anyone can upload; the browser reads the batch, the interpreter makes a call, and rows are appended to a Google Sheet through an Apps Script web app which also brokers a short-lived Earth Engine token.</desc>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#9fb0bf"/>
  </marker>
</defs>

<rect width="1060" height="700" fill="#ffffff"/>

<text x="30" y="38" font-size="19" font-weight="bold" fill="#16202b">PlotCall</text>
<text x="30" y="60" font-size="12.5" fill="#5d6e7e">Bake the evidence offline &#183; serve a folder &#183; make the call in a browser &#183; append a row</text>

<!-- lane 1: build -->
<rect x="30" y="84" width="306" height="392" rx="14" fill="#f7f9fb" stroke="#dde5ec"/>
<rect x="30" y="84" width="306" height="4" rx="2" fill="#2f7d55"/>
<text x="46" y="110" font-size="12" font-weight="bold" fill="#2f7d55" letter-spacing="1.1">1 &#183; BUILD</text>
<text x="46" y="127" font-size="11" fill="#7b8b99">python, on your machine, once per round</text>

<rect x="46" y="140" width="274" height="56" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="62" y="163" font-size="13" font-weight="bold" fill="#16202b">Your candidate points</text>
<text x="62" y="181" font-size="11.5" fill="#5d6e7e">CSV &#183; Parquet &#183; GeoJSON &#8212; ranked, or not</text>

<path d="M183 196 L183 218" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="46" y="220" width="274" height="70" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="62" y="242" font-size="11.5" font-family="monospace" fill="#16202b">build_label_batches.py</text>
<text x="62" y="260" font-size="11.5" fill="#5d6e7e">cuts 100 per batch, assigns readers,</text>
<text x="62" y="276" font-size="11.5" fill="#5d6e7e">draws the 5% double-read overlap</text>

<path d="M183 290 L183 312" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="46" y="314" width="274" height="86" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="62" y="336" font-size="11.5" font-family="monospace" fill="#16202b">build_batch_evidence | chips | dense</text>
<text x="62" y="354" font-size="11.5" fill="#5d6e7e">Earth Engine runs HERE and nowhere else:</text>
<text x="62" y="370" font-size="11.5" fill="#5d6e7e">point values, a nine-year sprite, an index</text>
<text x="62" y="386" font-size="11.5" fill="#5d6e7e">series &#8212; all baked to static files</text>

<path d="M183 400 L183 422" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="46" y="424" width="274" height="38" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="62" y="448" font-size="11.5" font-family="monospace" fill="#16202b">batches/b001.json + _chips/ + _dense/</text>

<!-- lane 2: serve -->
<rect x="368" y="84" width="292" height="392" rx="14" fill="#f7f9fb" stroke="#dde5ec"/>
<rect x="368" y="84" width="292" height="4" rx="2" fill="#2d5b8e"/>
<text x="384" y="110" font-size="12" font-weight="bold" fill="#2d5b8e" letter-spacing="1.1">2 &#183; SERVE</text>
<text x="384" y="127" font-size="11" fill="#7b8b99">a folder you upload &#8212; no build, no server</text>

<rect x="384" y="140" width="260" height="56" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="400" y="163" font-size="11.5" font-family="monospace" fill="#16202b">app/label_app.html</text>
<text x="400" y="181" font-size="11.5" fill="#5d6e7e">the whole interface, one file</text>

<rect x="384" y="206" width="260" height="56" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="400" y="229" font-size="11.5" font-family="monospace" fill="#16202b">app/config.js</text>
<text x="400" y="247" font-size="11.5" fill="#5d6e7e">endpoint, roster, campaign, legend</text>

<rect x="384" y="272" width="260" height="52" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="400" y="295" font-size="11.5" font-family="monospace" fill="#16202b">app/vendor/maplibre-gl</text>
<text x="400" y="313" font-size="11.5" fill="#5d6e7e">pinned, self-hosted, no CDN</text>

<rect x="384" y="334" width="260" height="52" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="400" y="357" font-size="11.5" font-family="monospace" fill="#16202b">app/batches/</text>
<text x="400" y="375" font-size="11.5" fill="#5d6e7e">the batch and its baked sidecars</text>

<path d="M514 386 L514 410" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>

<rect x="384" y="412" width="260" height="50" rx="9" fill="#ffffff" stroke="#2d5b8e"/>
<text x="400" y="434" font-size="13" font-weight="bold" fill="#16202b">GitHub Pages</text>
<text x="400" y="452" font-size="11.5" fill="#5d6e7e">or S3, or any static web root</text>

<path d="M336 443 L368 443" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>

<!-- lane 3: call -->
<rect x="692" y="84" width="338" height="392" rx="14" fill="#f7f9fb" stroke="#dde5ec"/>
<rect x="692" y="84" width="338" height="4" rx="2" fill="#a1591f"/>
<text x="708" y="110" font-size="12" font-weight="bold" fill="#a1591f" letter-spacing="1.1">3 &#183; CALL</text>
<text x="708" y="127" font-size="11" fill="#7b8b99">the interpreter's browser, offline-tolerant</text>

<rect x="708" y="140" width="306" height="76" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="724" y="163" font-size="13" font-weight="bold" fill="#16202b">One point, one 10 m cell</text>
<text x="724" y="181" font-size="11.5" fill="#5d6e7e">snapped to the UTM grid, drawn on the map</text>
<text x="724" y="197" font-size="11.5" fill="#5d6e7e">and inside every chip &#8212; not a dot</text>

<rect x="708" y="226" width="306" height="92" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="724" y="249" font-size="13" font-weight="bold" fill="#16202b">The evidence, side by side</text>
<text x="724" y="269" font-size="11.5" fill="#5d6e7e">dated high-resolution imagery at both years,</text>
<text x="724" y="286" font-size="11.5" fill="#5d6e7e">a nine-year filmstrip on one shared stretch,</text>
<text x="724" y="303" font-size="11.5" fill="#5d6e7e">a dense index series, other products folded</text>

<rect x="708" y="328" width="306" height="72" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="724" y="351" font-size="13" font-weight="bold" fill="#16202b">The call</text>
<text x="724" y="371" font-size="11.5" fill="#5d6e7e">class at each date + confidence, keyboard</text>
<text x="724" y="388" font-size="11.5" fill="#5d6e7e">first, flags for mixed / cannot interpret</text>

<rect x="708" y="410" width="306" height="52" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="724" y="432" font-size="13" font-weight="bold" fill="#16202b">Draft + outbox in the browser</text>
<text x="724" y="450" font-size="11.5" fill="#5d6e7e">nothing is lost to a dropped connection</text>

<path d="M660 280 L692 280" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>

<!-- lane 4: store -->
<rect x="30" y="508" width="1000" height="160" rx="14" fill="#f7f9fb" stroke="#dde5ec"/>
<rect x="30" y="508" width="1000" height="4" rx="2" fill="#6b3f8f"/>
<text x="46" y="534" font-size="12" font-weight="bold" fill="#6b3f8f" letter-spacing="1.1">4 &#183; STORE, AND THE ONE PIECE THAT IS NOT STATIC</text>

<rect x="46" y="548" width="300" height="98" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="62" y="570" font-size="11.5" font-family="monospace" fill="#16202b">app/apps_script/Code.gs</text>
<text x="62" y="590" font-size="11.5" fill="#5d6e7e">an Apps Script web app at /exec, pasted</text>
<text x="62" y="606" font-size="11.5" fill="#5d6e7e">into the Sheet. Three powers, no more:</text>
<text x="62" y="622" font-size="11.5" fill="#5d6e7e">append a row, read this campaign's rows,</text>
<text x="62" y="638" font-size="11.5" fill="#5d6e7e">mint a one-hour Earth Engine token</text>

<rect x="380" y="548" width="300" height="98" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="396" y="570" font-size="13" font-weight="bold" fill="#16202b">Google Sheet</text>
<text x="396" y="590" font-size="11.5" fill="#5d6e7e">one row per</text>
<text x="396" y="608" font-size="11.5" font-family="monospace" fill="#16202b">(campaign, batch, point, expert)</text>
<text x="396" y="626" font-size="11.5" fill="#5d6e7e">upserted, so a re-send changes nothing</text>
<text x="396" y="642" font-size="11.5" fill="#5d6e7e">and a second reader never overwrites</text>

<rect x="714" y="548" width="300" height="98" rx="9" fill="#ffffff" stroke="#cdd8e3"/>
<text x="730" y="570" font-size="13" font-weight="bold" fill="#16202b">Earth Engine (optional)</text>
<text x="730" y="590" font-size="11.5" fill="#5d6e7e">overlays the bake does not cover. The</text>
<text x="730" y="606" font-size="11.5" fill="#5d6e7e">service-account KEY lives in Script</text>
<text x="730" y="622" font-size="11.5" fill="#5d6e7e">Properties, server-side; the page only</text>
<text x="730" y="638" font-size="11.5" fill="#5d6e7e">ever holds the short-lived token</text>

<path d="M880 462 L880 548" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>
<text x="888" y="502" font-size="11" fill="#7b8b99">token</text>

<path d="M790 462 C790 500 560 500 560 548" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>
<text x="640" y="492" font-size="11" fill="#7b8b99">rows out</text>

<path d="M330 548 C330 500 712 500 712 462" fill="none" stroke="#9fb0bf" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="250" y="498" font-size="11" fill="#7b8b99">already-labelled points, back in</text>

<path d="M346 597 L380 597" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M680 597 L714 597" fill="none" stroke="#9fb0bf" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>

<text x="30" y="690" font-size="11" fill="#7b8b99">Earth Engine is never on the critical path of a call: it runs at build time, and at run time only for extra overlays.</text>
</svg>
